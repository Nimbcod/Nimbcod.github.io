<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimbcod</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff;
            color: #222;
            position: relative;
        }
        .org-name {
            font-size: clamp(3rem, 15vw, 12rem);
            font-weight: bold;
            margin-bottom: 2rem;
            text-align: center;
        }
        .member-name a {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #0066cc;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .member-name a:hover {
            opacity: 0.7;
        }
        .bottom-link {
            position: absolute;
            bottom: 20px;
        }
        .bottom-link a {
            font-size: 1rem;
            color: #666;
            text-decoration: none;
        }
        .bottom-link a:hover {
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="org-name">NIMBCOD</div>
    <div class="member-name">
        <a href="https://space.bilibili.com/3690991890466890" target="_blank">Xingfei</a>
    </div>
    <div class="bottom-link">
        <a href="https://nimbxingfei.github.io" target="_blank">→跳转到NimbXingfei的GitHub Pages</a>
    </div>
</body>
</html>
